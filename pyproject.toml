[project]
name = "myth-hash"
version = "0.3.0"
description = "A tool for generating human-readable, multilingual fantasy character names based on input string hashes."
authors = [{ name = "Claas Flint", email = "claas.flint@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cl445/myth-hash"
Repository = "https://github.com/cl445/myth-hash"
Changelog = "https://github.com/cl445/myth-hash/blob/main/CHANGELOG.md"

[project.scripts]
myth-hash = "myth_hash.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "bandit",
    "nox",
    "pyrefly",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".nox"]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["myth_hash", "tests", "noxfile.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PL",   # pylint
    "RUF",  # ruff-specific
    "D",    # pydocstyle
    "ANN",  # flake8-annotations (strict typing)
]
ignore = [
    "E501",  # line length is handled by the formatter
    "D105",  # magic methods are self-explanatory
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["myth_hash"]

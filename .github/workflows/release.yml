name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for PyPI trusted publishing

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv and Python 3.14
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"
        enable-cache: true

    - name: Check that tag matches project version
      id: version
      run: |
        PROJECT_VERSION=$(uv version --short)
        if [ "v${PROJECT_VERSION}" != "${GITHUB_REF_NAME}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${PROJECT_VERSION}"
          exit 1
        fi
        echo "VERSION=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Run checks and tests
      run: uv run --locked nox -s check test-3.14

    - name: Build package
      run: uv build

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        body: |
          See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          ## Installation

          ```bash
          pip install myth-hash==${{ steps.version.outputs.VERSION }}
          ```
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
